<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain model</title>
<!-- Offline viewer made with Hyperscale Landscapes. Everything it needs is
     inside this one file: open it in any modern browser, no internet needed. -->
<!--FONTS-->
<style>
  /* Swiss / International: one grotesque, strictly black and white. */
  :root { --paper: rgba(255,255,255,0.94); --ink: #000; --grey: #5c5c5c; --rule: #000; --spot: #000; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: var(--ink);
    font: 13px/1.4 Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #panel { position: fixed; top: 0; left: 0; bottom: 0; width: 320px; overflow-y: auto;
    background: var(--paper); border-right: 1px solid var(--rule); padding: 20px 18px; }
  h1 { font-size: 26px; font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 8px; }
  #sub { color: var(--grey); font-size: 11.5px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 4px solid var(--spot); }
  h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; font-weight: 700; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin: 0; padding: 4px 0; border-bottom: 1px solid #e6e6e6; }
  details { color: var(--grey); font-size: 11.5px; margin-left: 22px; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
  .check { display: flex; gap: 6px; align-items: center; cursor: pointer; margin: 3px 0; }
  input[type=checkbox], input[type=range] { accent-color: var(--spot); }
  fieldset { border: 0; border-top: 1px solid var(--rule); margin: 12px 0 0; padding: 8px 0 2px; min-width: 0; }
  legend { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; padding: 0 4px 0 0; }
  label { display: block; margin: 4px 0; }
  .range { display: grid; grid-template-columns: 78px 1fr 44px; align-items: center; gap: 8px; }
  .range output { color: var(--grey); text-align: right; font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .inline { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  button, select { font: inherit; font-weight: 700; color: var(--ink); background: #fff; border: 1px solid var(--ink);
    border-radius: 0; padding: 5px 9px; cursor: pointer; }
  button:hover { background: var(--ink); color: #fff; }
  button.primary { background: var(--ink); color: #fff; }
  button.primary:hover { background: #fff; color: var(--ink); }
  select { font-weight: 400; max-width: 100%; }
  .hint { color: var(--grey); font-size: 11px; }
  #caption { color: var(--grey); font-size: 11px; border-top: 1px solid var(--rule); padding-top: 8px; margin-top: 12px; }
  #attr { position: fixed; right: 10px; bottom: 8px; max-width: 55%; font-size: 10.5px; color: #000;
    background: rgba(255,255,255,0.85); padding: 3px 6px; text-align: right; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; }
  #showui { position: fixed; top: 14px; left: 14px; display: none; }
  body.hidden #panel { display: none; } body.hidden #showui { display: block; }
  body.clean #panel, body.clean #attr, body.clean #showui { display: none; }
  :focus-visible { outline: 3px solid var(--spot); outline-offset: 2px; }
  .geo-legend h3 { text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 700; margin: 9px 0 3px; color: #5c5c5c; }
  .geo-row { display: flex; gap: 7px; align-items: flex-start; font-size: 11.5px; line-height: 1.3; margin: 4px 0; }
  .geo-row img, .geo-row svg { flex: none; margin-top: 1px; }
  .geo-legend .hint { margin: 4px 0; }
  @media (max-width: 700px) { #panel { width: auto; right: 0; top: auto; max-height: 45%; border-right: 0; border-top: 1px solid var(--rule); } }
</style>
<!--IMPORTMAP-->
</head>
<body>
<div id="view"></div>
<div id="loading">Loading the model…</div>
<div id="panel" role="region" aria-label="Viewer controls">
  <h1 id="title"></h1>
  <div id="sub"></div>
  <h2>Layers</h2>
  <ul id="layers"></ul>
  <div id="studio"></div>
  <p id="caption"></p>
  <p class="hint">Keys: <b>H</b> hide panel · <b>C</b> clean view · <b>P</b> save image. Drag to turn, right-drag to move, scroll to zoom.</p>
</div>
<button id="showui" type="button">Show controls (H)</button>
<div id="attr"></div>
<!--DATA-->
<!--MAIN-->
</body>
</html>
