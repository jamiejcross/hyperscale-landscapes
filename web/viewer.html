<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain model</title>
<!-- Offline viewer made with Hyperscale Landscapes. Everything it needs is
     inside this one file: open it in any modern browser, no internet needed. -->
<style>
  :root { --panel: rgba(18,20,24,0.84); --line: rgba(255,255,255,0.13); --text: #e8e6e1; --muted: #a39f96; --accent: #8fbf7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1c20; color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #panel { position: fixed; top: 14px; left: 14px; width: 300px; max-height: calc(100% - 28px); overflow-y: auto;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  #sub { color: var(--muted); font-size: 11.5px; margin-bottom: 8px; }
  h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin: 4px 0; }
  details { color: var(--muted); font-size: 11.5px; margin-left: 22px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .check { display: flex; gap: 6px; align-items: center; cursor: pointer; margin: 3px 0; }
  input[type=checkbox], input[type=range] { accent-color: var(--accent); }
  fieldset { border: 0; border-top: 1px solid var(--line); margin: 8px 0 0; padding: 8px 0 2px; }
  legend { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 4px 0 0; }
  .range { display: grid; grid-template-columns: 78px 1fr 44px; align-items: center; gap: 8px; margin: 4px 0; }
  .range output { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .inline { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  button, select { font: inherit; color: var(--text); background: rgba(255,255,255,0.07); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  button:hover, select:hover { background: rgba(255,255,255,0.14); }
  button.primary { background: var(--accent); color: #14200f; border-color: transparent; font-weight: 600; }
  .hint { color: var(--muted); font-size: 11px; }
  #caption { color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
  #attr { position: fixed; right: 10px; bottom: 8px; max-width: 60%; font-size: 10.5px; color: rgba(255,255,255,0.7);
    text-shadow: 0 1px 2px rgba(0,0,0,.7); text-align: right; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
  #showui { position: fixed; top: 14px; left: 14px; display: none; }
  body.hidden #panel { display: none; } body.hidden #showui { display: block; }
  body.clean #panel, body.clean #attr, body.clean #showui { display: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 700px) { #panel { width: auto; right: 14px; max-height: 45%; top: auto; bottom: 14px; } }
</style>
<!--IMPORTMAP-->
</head>
<body>
<div id="view"></div>
<div id="loading">Loading the model…</div>
<div id="panel" role="region" aria-label="Viewer controls">
  <h1 id="title"></h1>
  <div id="sub"></div>
  <h2>Layers</h2>
  <ul id="layers"></ul>
  <div id="studio"></div>
  <p id="caption"></p>
  <p class="hint">Keys: <b>H</b> hide panel · <b>C</b> clean view · <b>P</b> save image. Drag to turn, right-drag to move, scroll to zoom.</p>
</div>
<button id="showui" type="button">Show controls (H)</button>
<div id="attr"></div>
<!--DATA-->
<!--MAIN-->
</body>
</html>
