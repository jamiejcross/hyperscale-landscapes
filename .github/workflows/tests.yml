name: tests
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    env:
      HYPERSCALE_OFFLINE: "1"      # CI never touches the network
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "pipeline[dev]"
      - run: python -m pyflakes pipeline/hyperscale_landscapes pipeline/tests
      - run: pytest pipeline/tests -q
