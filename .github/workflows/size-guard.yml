name: size-guard
on: [push, pull_request]
jobs:
  no-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on any tracked file over 5 MB
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -type f -size +5M)
          if [ -n "$big" ]; then echo "Files over 5 MB:"; echo "$big"; exit 1; fi
